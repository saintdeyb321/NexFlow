name: Concierge disposable Redis certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concierge-redis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-stores:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.10
        env:
          POSTGRES_USER: nexflow_rc3
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: nexflow_rc3_admin
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U nexflow_rc3 -d nexflow_rc3_admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.2
        ports:
          - '127.0.0.1:16379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      GCLOUD_PROJECT: demo-nexflow-rc3
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      NEXFLOW_RC3_POSTGRES: Host=127.0.0.1;Port=5432;Database=nexflow_rc3_admin;Username=nexflow_rc3;Password=local-test-only
      JAVA_TOOL_OPTIONS: -Xmx1024m
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.14.0
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install controlled emulator tooling (runner only)
        run: |
          npm install --global firebase-tools@14.12.0
          firebase setup:emulators:firestore
      - name: Restore and build
        run: |
          dotnet restore backend/backend.slnx
          dotnet restore backend/NexFlow.Tests/NexFlow.Tests.csproj
          dotnet build backend/backend.slnx --no-restore
          dotnet build backend/NexFlow.Tests/NexFlow.Tests.csproj --no-restore
      - name: Real isolated Redis plus PostgreSQL and Firestore Emulator
        env:
          NEXFLOW_RC3_INTEGRATION: '1'
          NEXFLOW_CONCIERGE_REDIS_INTEGRATION: '1'
          NEXFLOW_CONCIERGE_REDIS_ENDPOINT: 127.0.0.1:16379
        run: >-
          firebase emulators:exec --only firestore --project demo-nexflow-rc3
          --config backend/NexFlow.Tests/Integration/emulator/firebase.json
          'dotnet test backend/NexFlow.Tests/NexFlow.Tests.csproj --no-build --no-restore --filter Category=RedisIntegration --logger "trx;LogFileName=redis.trx" --results-directory artifacts/rc3'
      - name: Require exactly one executed passing Redis contract
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/rc3/redis.trx').getroot()
          counters = root.find('.//{*}Counters')
          assert counters is not None
          assert all(int(counters.attrib[key]) == 1 for key in ('total', 'executed', 'passed')), 'Exactly one Redis test, zero skips/failures required'
          assert int(counters.attrib['failed']) == 0
      - name: Record release identity without configuration payloads
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          target = Path('artifacts/rc3'); target.mkdir(parents=True, exist_ok=True)
          data = {key: os.environ[key] for key in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB')}
          (target / 'identity.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
      - name: Upload synthetic test results only
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: concierge-redis-test-results
          path: artifacts/rc3/
          if-no-files-found: warn
          retention-days: 7
# No SaaS secrets, environment/deployment permissions or cloud login. The
# service container and emulator terminate with the disposable job/exec scope.
